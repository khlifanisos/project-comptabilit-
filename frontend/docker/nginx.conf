server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 55M;

    root /usr/share/nginx/html;
    index index.html;

    # Never serve hidden files (.gitignore, .env, ...)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Laravel API -> PHP-FPM in the backend container
    location ~ ^/(api|sanctum)/ {
        fastcgi_pass backend:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Files uploaded through Laravel's "public" disk (shared volume)
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        try_files $uri =404;
    }

    # Avatars written to public/uploads (shared volume)
    location /uploads/ {
        root /var/www/html/public;
        try_files $uri =404;
    }

    # Hashed build assets can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: every other path loads the SPA
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
